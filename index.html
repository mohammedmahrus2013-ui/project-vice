<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJECT VICE — Open World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121c;font-family:Arial,Helvetica,sans-serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
#brand{position:absolute;top:24px;left:28px;font-weight:900;letter-spacing:5px;font-size:22px;text-shadow:0 2px 12px #000}
#brand span{color:#5de2dc}
#sub{font-size:9px;letter-spacing:3px;color:#b8d7d8;margin-top:5px}
#speedbox{position:absolute;right:28px;bottom:28px;text-align:right;text-shadow:0 2px 10px #000}
#speed{font-size:54px;font-weight:800;line-height:1}.unit{font-size:11px;letter-spacing:3px;color:#9ed9d7}
#help{position:absolute;left:28px;bottom:28px;font-size:11px;line-height:1.8;color:#d4e5e5;text-shadow:0 2px 8px #000}
#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.3}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(130deg,#07121c,#143b49);font-weight:800;letter-spacing:6px;font-size:18px;transition:opacity .8s}
#loading small{display:block;text-align:center;font-size:9px;letter-spacing:3px;color:#78d8d1;margin-top:12px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script>
</head>
<body>
<div id="hud"><div id="brand">PROJECT <span>VICE</span><div id="sub">COASTAL CITY • OPEN WORLD</div></div><div id="crosshair"></div><div id="help">W / ↑ ACCELERATE &nbsp; S / ↓ BRAKE<br>A / ← STEER &nbsp; D / → STEER<br>SPACE HANDBRAKE &nbsp; SHIFT BOOST</div><div id="speedbox"><div id="speed">000</div><div class="unit">KM/H</div></div></div>
<div id="loading">PROJECT VICE<div><small>BUILDING THE CITY</small></div></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ab9c8);scene.fog=new THREE.FogExp2(0x9bbfc6,.00145);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,1800);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9efff,0x35433c,2.0));
const sun=new THREE.DirectionalLight(0xffe2bd,3.1);sun.position.set(-180,260,130);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-260;sun.shadow.camera.right=260;sun.shadow.camera.top=260;sun.shadow.camera.bottom=-260;sun.shadow.bias=-.00015;scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const asphalt=mat(0x252d32,.96),sidewalk=mat(0x9b9b91),concrete=mat(0xc2b9a6),glass=mat(0x315363,.24,.55),white=mat(0xe8e5d9),yellow=mat(0xe7c56a),green=mat(0x315c4a),trunk=mat(0x76543a);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),mat(0x6d8c78));ground.rotation.x=-Math.PI/2;ground.position.y=-.18;ground.receiveShadow=true;scene.add(ground);
function box(w,h,d,material,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function road(x,z,w,d){box(w,.12,d,asphalt,x,-.04,z);}
// city grid: broad avenues and smaller cross streets
for(let i=-4;i<=4;i++){
 const p=i*92;road(p,0,23,850);road(0,p,850,23);
 // sidewalks along avenue edges
 for(const s of [-1,1]){box(3,.24,850,sidewalk,p+s*13,.02,0);box(850,.24,3,sidewalk,0,.02,p+s*13);}
}
// road markings
for(let i=-4;i<=4;i++)for(let z=-400;z<420;z+=18){box(.22,.025,7,yellow,i*92,.035,z);box(7,.025,.22,white,z,.035,i*92);}
// urban blocks with varied towers, podiums, balconies and window bands
const palettes=[0xd0c2a8,0x9caeb0,0xc5b7a4,0x8c9a9a,0xd7d0bd,0x9babae,0xb7a58e];
function building(x,z,w,d,h,idx){
 const baseMat=mat(palettes[idx%palettes.length],.82);
 box(w,h,d,baseMat,x,h/2,z);
 // podium
 box(w+1,2,d+1,mat(0x777d78),x,1,z);
 // stacked horizontal floor lines
 for(let y=4;y<h-1;y+=4){box(w+.12,.12,d+.12,mat(0x6d7778),x,y,z)}
 // front-facing window grids on both long facades
 const winMat=glass;
 for(let y=2.4;y<h-1;y+=3.2){
  for(let xx=-w/2+2;xx<w/2-1;xx+=3.2){
   box(1.65,1.65,.08,winMat,x+xx,y,z+d/2+.045);
   box(1.65,1.65,.08,winMat,x+xx,y,z-d/2-.045);
  }
 }
 // rooftop parapet, mechanical core, rooftop details
 box(w+.6,.8,d+.6,mat(0x777d7a),x,h+.35,z);
 box(w*.24,2.2,d*.25,mat(0x777e7b),x-w*.2,h+1.3,z);
 for(let k=0;k<3;k++)box(1.2,.5,1.2,mat(0x4d5b5d),x+w*.2+k*1.8,h+1,z-d*.2);
}
let seed=17;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let gx=-4;gx<4;gx++)for(let gz=-4;gz<4;gz++){
 const cx=gx*92+46,cz=gz*92+46;
 if(Math.abs(cx)<65&&Math.abs(cz)<65)continue;
 const count=2+Math.floor(rand()*3);
 for(let n=0;n<count;n++){
  const w=18+rand()*23,d=18+rand()*22,h=14+Math.pow(rand(),1.8)*92;
  const x=cx+(rand()-.5)*42,z=cz+(rand()-.5)*42;
  building(x,z,w,d,h,Math.floor(rand()*palettes.length));
 }
}
// waterfront promenade / blue ocean edge
const waterMat=new THREE.MeshStandardMaterial({color:0x287d91,roughness:.24,metalness:.18});
const water=new THREE.Mesh(new THREE.PlaneGeometry(1800,360),waterMat);water.rotation.x=-Math.PI/2;water.position.set(0,-.3,-610);scene.add(water);
for(let x=-380;x<=380;x+=18){box(8,.3,1.2,mat(0xd7d0bd),x,.1,-430)}
// palms: curved-ish tapered trunk segments, fronds
function palm(x,z,scale=1){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const cyl=new THREE.Mesh(new THREE.CylinderGeometry(.32*scale,.55*scale,7*scale,7),trunk);cyl.position.y=3.5*scale;cyl.rotation.z=-.08;cyl.castShadow=true;g.add(cyl);
 for(let i=0;i<9;i++){const a=i*Math.PI*2/9;const f=new THREE.Mesh(new THREE.ConeGeometry(.42*scale,6.8*scale,5),green);f.position.set(Math.cos(a)*2.1*scale,7*scale,Math.sin(a)*2.1*scale);f.rotation.z=-Math.cos(a)*.85;f.rotation.x=Math.sin(a)*.85;f.castShadow=true;g.add(f)}
}
for(let i=-20;i<=20;i++){palm(i*18,-420,0.8+(i%3)*.08);if(i%2===0)palm(-18,i*18,0.8)}
// streetlights and signs
const metal=mat(0x3d484a,.45,.7),lampmat=new THREE.MeshStandardMaterial({color:0xffe6b1,emissive:0xffc36a,emissiveIntensity:1.1});
for(let x=-360;x<=360;x+=46)for(let z=-360;z<=360;z+=92){
 box(.28,8,.28,metal,x,4,z);box(2.5,.22,.22,metal,x+1.1,7.8,z);
 const l=new THREE.Mesh(new THREE.BoxGeometry(.8,.18,.5),lampmat);l.position.set(x+2.1,7.7,z);scene.add(l);
}
// parked vehicles add street life
const carColors=[0x202a35,0xc5c4bc,0x9e332b,0x294e68];
function parkedCar(x,z,rot=0,color=0x263746){
 const g=new THREE.Group();g.position.set(x,.55,z);g.rotation.y=rot;scene.add(g);
 const body=mat(color,.32,.55),rubber=mat(0x111416,.9),rim=mat(0xaeb9bb,.25,.8);
 box(2.1,.65,4.5,body,0,0,0,g);box(1.65,.68,2.2,glass,0,.58,-.12,g);
 for(const xx of [-1,1])for(const zz of [-1.45,1.45]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.24,16),rubber);wh.rotation.z=Math.PI/2;wh.position.set(xx*1.05,-.12,zz);g.add(wh)}
}
for(let i=-3;i<=3;i++)for(let z=-3;z<=3;z++)if((i+z)%3===0)parkedCar(i*92+18,z*92+29,0,carColors[Math.abs(i+z)%4]);
// Player sports car
const car=new THREE.Group();scene.add(car);
const wheelMeshes=[];car.position.set(0,.55,8);
const red=mat(0xb51f29,.25,.72),dark=mat(0x10171b,.3,.55),rubber=mat(0x090b0d,.92),rim=mat(0xb6c0c4,.2,.85),head= new THREE.MeshStandardMaterial({color:0xfff0d2,emissive:0xffd99b,emissiveIntensity:1.4});
box(2.35,.58,4.8,red,0,0,0,car);box(2.05,.28,1.5,red,0,.34,1.55,car);box(1.85,.72,2.15,glass,0,.58,-.1,car);
box(2.2,.13,1.05,dark,0,-.22,-1.85,car);box(.38,.16,.12,head,-.78,.03,2.42,car);box(.38,.16,.12,head,.78,.03,2.42,car);
for(const x of [-1,1])for(const z of [-1.55,1.55]){
 const wheel=new THREE.Group();wheel.position.set(x*1.15,-.16,z);car.add(wheel);wheelMeshes.push(wheel);
 const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,24),rubber);tire.rotation.z=Math.PI/2;tire.castShadow=true;wheel.add(tire);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.3,16),rim);hub.rotation.z=Math.PI/2;wheel.add(hub);
 wheel.userData.spin=true;
}
const spoiler=box(2.1,.12,.45,dark,0,.62,-2.12,car);box(.12,.48,.12,dark,-.78,.38,-2.12,car);box(.12,.48,.12,dark,.78,.38,-2.12,car);
car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
// VICE vehicle dynamics: fixed-step integration, grip, braking and handbrake drift
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()},{passive:false});
addEventListener('keyup',e=>{keys[e.code]=false});
const clock=new THREE.Clock();
const camTarget=new THREE.Vector3(),desiredCam=new THREE.Vector3(),cameraLook=new THREE.Vector3();
const velocity=new THREE.Vector3();
let heading=0,steerAngle=0,boostHeat=0,accumulator=0;
const FIXED_DT=1/120;
const maxForward=boost=>boost?58:43;
function physicsStep(dt){
 const throttle=(keys.KeyW||keys.ArrowUp)?1:0;
 const brake=(keys.KeyS||keys.ArrowDown)?1:0;
 const left=(keys.KeyA||keys.ArrowLeft)?1:0;
 const right=(keys.KeyD||keys.ArrowRight)?1:0;
 const handbrake=!!keys.Space,boost=!!(keys.ShiftLeft||keys.ShiftRight);
 const steerInput=left-right;
 const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
 const lateral=new THREE.Vector3(Math.cos(heading),0,-Math.sin(heading));
 let longitudinal=velocity.dot(forward);
 let sideways=velocity.dot(lateral);
 const speedAbs=Math.abs(longitudinal);
 // Engine torque and progressive braking
 const engineForce=(boost?37:24)*throttle;
 longitudinal+=engineForce*dt;
 if(brake){
   if(Math.abs(longitudinal)>1) longitudinal-=Math.sign(longitudinal)*Math.min(Math.abs(longitudinal),42*dt);
   else longitudinal-=16*dt;
 }
 // Rolling resistance and aerodynamic drag
 longitudinal*=Math.exp(-(0.42+speedAbs*0.006)*dt);
 longitudinal=THREE.MathUtils.clamp(longitudinal,-17,maxForward(boost));
 // Tire grip: handbrake releases rear grip for controllable slides
 const grip=handbrake?1.25:8.8+Math.min(speedAbs*.055,2.2);
 sideways*=Math.exp(-grip*dt);
 // Steering builds with speed, with reduced authority at a standstill
 const steerTarget=steerInput*(0.62+Math.min(speedAbs/28,1.15));
 steerAngle=THREE.MathUtils.damp(steerAngle,steerTarget,handbrake?5.2:8.5,dt);
 const direction=Math.sign(longitudinal||1);
 const yawRate=steerAngle*(0.12+Math.min(speedAbs/17,1.55))*direction*(handbrake?1.42:1);
 heading+=yawRate*dt;
 // Handbrake adds a little rear rotation; countersteer remains possible
 if(handbrake&&speedAbs>8&&Math.abs(steerInput)>.1) sideways+=-steerInput*speedAbs*.12*dt;
 const fwd=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
 const side=new THREE.Vector3(Math.cos(heading),0,-Math.sin(heading));
 velocity.copy(fwd.multiplyScalar(longitudinal).add(side.multiplyScalar(sideways)));
 car.position.addScaledVector(velocity,dt);
 car.rotation.y=heading;
 // Basic suspension response and wheel rotation
 const bounce=Math.sin(clock.elapsedTime*18+speedAbs*.12)*Math.min(speedAbs/100,.025);
 car.position.y=THREE.MathUtils.damp(car.position.y,.55+bounce,10,dt);
 for(const wheel of wheelMeshes){
   wheel.children[0].rotation.x-=longitudinal*dt/0.43;
   wheel.rotation.y=wheel.position.z>0?steerAngle*.42:0;
 }
 // Keep the player in the playable city bounds
 car.position.x=THREE.MathUtils.clamp(car.position.x,-405,405);
 car.position.z=THREE.MathUtils.clamp(car.position.z,-405,405);
}
function animate(){
 requestAnimationFrame(animate);
 const frameDt=Math.min(clock.getDelta(),.05);
 accumulator+=frameDt;
 let steps=0;
 while(accumulator>=FIXED_DT&&steps<8){physicsStep(FIXED_DT);accumulator-=FIXED_DT;steps++}
 if(steps===8)accumulator=0;
 const speed=velocity.length();
 const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
 const lookAhead=THREE.MathUtils.clamp(speed*.13,2,9);
 const behind=new THREE.Vector3(-Math.sin(heading)*10,5.2+Math.min(speed*.018,1.4),-Math.cos(heading)*10);
 desiredCam.copy(car.position).add(behind);
 camera.position.lerp(desiredCam,1-Math.exp(-4.8*frameDt));
 cameraLook.copy(car.position).addScaledVector(forward,lookAhead);
 cameraLook.y=1.25;
 camTarget.lerp(cameraLook,1-Math.exp(-6*frameDt));
 camera.lookAt(camTarget);
 camera.fov=THREE.MathUtils.damp(camera.fov,66+Math.min(speed*.12,8),3,frameDt);
 camera.updateProjectionMatrix();
 document.getElementById('speed').textContent=String(Math.round(speed*3.6)).padStart(3,'0');
 water.position.x=Math.sin(clock.elapsedTime*.12)*2;
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity='0';setTimeout(()=>l.remove(),900)},900);
</script></body></html>
